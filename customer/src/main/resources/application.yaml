spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/customer # Bazangiz nomiga qarab o'zgartirasiz
    username: postgres                             # Bazadagi username
    password: 1234                             # Bazadagi parolingiz
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
#    admin:
#      auto-create: true
    producer:
      bootstrap-servers: localhost:9092
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  application:
    name: customer
server:
  port: 8080
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/